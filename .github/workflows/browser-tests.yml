name: Debtbreak browser tests
on:
  workflow_dispatch:
  push:
    branches: ['main', 'sync/debtbreak-v51']
  pull_request:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser:all
      - name: Keep reports, screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debtbreak-browser-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 14
