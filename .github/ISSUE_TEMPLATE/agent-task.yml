name: Contribution proposal or assigned task
description: Offer an experiment or define a scoped assignment; submission is not approval to integrate.
title: "[Proposal] "
body:
  - type: markdown
    attributes:
      value: |
        Read AGENTS.md. Unsolicited public-scope proposals are welcome; no assignment is required.
        Only the owner can make an assigned task READY or authorize integration.
        Use your own compute and fork. No merge, deployment, new owner expense,
        private-source access or owner credential is authorized by this form.
  - type: input
    id: task_id
    attributes:
      label: Related task or experiment reference (optional)
      placeholder: Existing VAG/EXP ID, or unsolicited proposal
    validations:
      required: false
  - type: textarea
    id: why
    attributes:
      label: Outcome and why it matters
      description: One useful deliverable, not a broad rebuild.
    validations:
      required: true
  - type: input
    id: base
    attributes:
      label: Reference base commit
      description: Exact SHA used for an experiment; assigned tasks must use their approved base.
    validations:
      required: true
  - type: textarea
    id: inputs
    attributes:
      label: Public inputs and references
      description: Link accessible source, documented evidence and relevant existing tests.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Allowed paths and prohibited changes
      description: Identify protected changes and separate approval needs.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance tests and evidence
      description: Commands, expected behavior, provenance, preview and limitations.
    validations:
      required: true
  - type: textarea
    id: budget
    attributes:
      label: Budget and stop conditions
      value: |
        New owner spending authorization: $0. Contributor uses own authorized compute.
        Live API requests: 0 unless separately bounded and approved in this task.
        For assigned tasks, report a blocker after two materially different blocked approaches.
        Privately funded exploratory research is not limited by that handoff convention.
    validations:
      required: true
  - type: textarea
    id: authority
    attributes:
      label: Owner authorization and readiness
      description: Optional for a proposal. The owner must explicitly approve readiness for an assignment; submission never authorizes integration.
    validations:
      required: false
